<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="styles.css" />
    <title>Shopping Cart</title>
  </head>

  <body>
    <!-- navigation links-->
    <div class="navbar" style=" z-index: 999">
      <a href="index.html">Home</a>
      <a href="products.html">Products</a>
      <a href="aboutus.html">About us</a>
      <a href="/cart.html" style="display: flex; align-items: center; justify-content: center; background: rgba(255,255,255,0.358); border-radius: 6px; width: 48px; height: 48px; padding: 0;">
        <img src="/images/cart-icon.svg" alt="Cart" style="width:28px; height:28px; margin: auto;">
        <span id="cart-count" style="position: absolute; background: red; color: white; border-radius: 50%; width: 20px; height: 20px; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: bold;">0</span>
      </a>
    </div>

    <div class="main-content">
      <h1>Shopping Cart</h1>
      <div id="cart-items-container"></div>
      <div id="cart-summary">
        <h3>Total: <span id="cart-total">R0.00</span></h3>
        <button id="continue-payment-btn" class="payment-btn">Continue to Payment</button>
      </div>
    </div>

    <!-- Payment Modal -->
    <div id="payment-modal" class="modal" style="display: none;">
      <div class="modal-content">
        <span class="close" id="close-payment">&times;</span>
        <h2>Payment Details</h2>
        <form id="payment-form">
          <div class="form-group">
            <label for="full-name">Full Name:</label>
            <input type="text" id="full-name" required />
          </div>

          <div class="form-group">
            <label for="email">Email:</label>
            <input type="email" id="email" required />
          </div>

          <div class="form-group">
            <label for="address">Address:</label>
            <input type="text" id="address" required />
          </div>

          <div class="form-group">
            <label for="card-number">Card Number:</label>
            <input type="text" id="card-number" placeholder="1234 5678 9012 3456" required />
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="expiry">Expiry Date:</label>
              <input type="text" id="expiry" placeholder="MM/YY" required />
            </div>
            <div class="form-group">
              <label for="cvv">CVV:</label>
              <input type="text" id="cvv" placeholder="123" required />
            </div>
          </div>

          <div class="form-group">
            <p>Total Amount: <strong id="payment-total">R0.00</strong></p>
          </div>

          <button type="submit" class="submit-btn">Complete Purchase</button>
        </form>
      </div>
    </div>

    <script>
      let cart = JSON.parse(localStorage.getItem('cart')) || [];

      // Display cart items
      function displayCart() {
        const container = document.getElementById('cart-items-container');
        
        if (cart.length === 0) {
          container.innerHTML = '<p style="text-align: center; font-size: 18px; color: #666;">Your cart is empty</p>';
          document.getElementById('cart-summary').style.display = 'none';
          return;
        }

        document.getElementById('cart-summary').style.display = 'block';
        container.innerHTML = '';

        cart.forEach((item, index) => {
          const itemTotal = (item.price * item.quantity).toFixed(2);
          const cartItem = document.createElement('div');
          cartItem.className = 'cart-item';

          cartItem.innerHTML = `
            <img src="${item.image || 'images/placeholder.png'}" alt="${item.name}" width="100" />
            <div class="item-info">
              <h3>${item.name}</h3>
              <p>${item.description}</p>
              <p class="item-price">R${item.price}</p>
            </div>
            <div class="item-quantity">
              <button class="qty-btn" onclick="updateQuantity(${index}, -1)">−</button>
              <input type="number" value="${item.quantity}" readonly />
              <button class="qty-btn" onclick="updateQuantity(${index}, 1)">+</button>
            </div>
            <div class="item-total">
              <p>R${itemTotal}</p>
              <button class="remove-btn" onclick="removeItem(${index})">Remove</button>
            </div>
          `;
          container.appendChild(cartItem);
        });

        updateCartTotal();
      }

      function updateQuantity(index, change) {
        cart[index].quantity += change;
        if (cart[index].quantity < 1) {
          cart.splice(index, 1);
        }
        localStorage.setItem('cart', JSON.stringify(cart));
        displayCart();
        updateCartCount();
      }

      function removeItem(index) {
        cart.splice(index, 1);
        localStorage.setItem('cart', JSON.stringify(cart));
        displayCart();
        updateCartCount();
      }

      function updateCartTotal() {
        const total = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0).toFixed(2);
        document.getElementById('cart-total').textContent = 'R' + total;
        document.getElementById('payment-total').textContent = 'R' + total;
      }

      function updateCartCount() {
        const count = cart.reduce((sum, item) => sum + item.quantity, 0);
        document.getElementById('cart-count').textContent = count;
      }

      // Payment Modal
      const paymentModal = document.getElementById('payment-modal');
      const closePaymentBtn = document.getElementById('close-payment');
      const continuePaymentBtn = document.getElementById('continue-payment-btn');
      const paymentForm = document.getElementById('payment-form');

      continuePaymentBtn.addEventListener('click', () => {
        paymentModal.style.display = 'block';
      });

      closePaymentBtn.addEventListener('click', () => {
        paymentModal.style.display = 'none';
      });

      window.addEventListener('click', (event) => {
        if (event.target === paymentModal) {
          paymentModal.style.display = 'none';
        }
      });

      paymentForm.addEventListener('submit', (e) => {
        e.preventDefault();
        alert('Payment successful! Thank you for your purchase.');
        cart = [];
        localStorage.setItem('cart', JSON.stringify(cart));
        paymentModal.style.display = 'none';
        displayCart();
        updateCartCount();
      });

      // Initial display
      displayCart();
      updateCartCount();
    </script>
  </body>
</html>
