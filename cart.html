<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="styles.css" />
    <title>Shopping Cart</title>
  </head>

  <body>
    <!-- navigation links-->
    <div class="navbar" style=" z-index: 999">
      <a href="index.html">Home</a>
      <a href="products.html">Products</a>
      <a href="aboutus.html">About us</a>
      <a href="/cart.html" style="display: flex; align-items: center; justify-content: center; background: rgba(255,255,255,0.358); border-radius: 6px; width: 48px; height: 48px; padding: 0;">
        <span id="cart-count" style="position: absolute; background: red; color: white; border-radius: 50%; width: 20px; height: 20px; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: bold;">0</span>
      </a>
    </div>

    <div class="main-content">
      <h1>Shopping Cart</h1>
      <div id="cart-items-container"></div>
      <div id="cart-summary">
        <h3>Total: <span id="cart-total">R0.00</span></h3>
        <button id="continue-payment-btn" class="payment-btn">Continue to Payment</button>
      </div>
    </div>

    <!-- Payment Modal (REPLACE existing modal and script with the block below) -->
    <div id="payment-modal" class="modal" style="display: none;">
      <div class="modal-content">
        <span class="close" id="close-payment">&times;</span>
        <h2>Payment Details</h2>

        <form id="payment-form" novalidate>
          <div class="form-group">
            <label>Payment method</label>
            <div style="display:flex;gap:12px;flex-wrap:wrap;margin-top:8px;">
              <label><input type="radio" name="payment-method" value="card" checked> Card</label>
              <label><input type="radio" name="payment-method" value="paypal"> PayPal</label>
              <label><input type="radio" name="payment-method" value="mobile"> Mobile Money</label>
              <label><input type="radio" name="payment-method" value="cod"> Cash on Delivery</label>
            </div>
          </div>

          <!-- Card fields -->
          <div id="card-fields" class="payment-fields" style="margin-top:12px;">
            <div class="form-group">
              <label for="card-name">Name on card</label>
              <input type="text" id="card-name" />
            </div>
            <div class="form-group">
              <label for="card-number">Card Number</label>
              <input type="text" id="card-number" placeholder="1234 5678 9012 3456" />
            </div>

            <div class="form-row">
              <div class="form-group">
                <label for="expiry">Expiry (MM/YY)</label>
                <input type="text" id="expiry" placeholder="MM/YY" />
              </div>
              <div class="form-group">
                <label for="cvv">CVV</label>
                <input type="text" id="cvv" placeholder="123" />
              </div>
            </div>
          </div>

          <!-- PayPal fields -->
          <div id="paypal-fields" class="payment-fields" style="display:none; margin-top:12px;">
            <div class="form-group">
              <label for="paypal-email">PayPal Email</label>
              <input type="email" id="paypal-email" placeholder="you@example.com" />
            </div>
          </div>

          <!-- Mobile Money fields -->
          <div id="mobile-fields" class="payment-fields" style="display:none; margin-top:12px;">
            <div class="form-group">
              <label for="mobile-provider">Provider</label>
              <select id="mobile-provider">
                <option value="">Select provider</option>
                <option value="mtn">MTN</option>
                <option value="vodacom">Vodacom</option>
              </select>
            </div>
            <div class="form-group">
              <label for="mobile-number">Mobile Number</label>
              <input type="tel" id="mobile-number" placeholder="+27 82 123 4567" />
            </div>
          </div>

          <!-- Cash on Delivery fields -->
          <div id="cod-fields" class="payment-fields" style="display:none; margin-top:12px;">
            <div class="form-group">
              <label for="cod-contact">Contact number for delivery</label>
              <input type="tel" id="cod-contact" placeholder="+27 82 123 4567" />
            </div>
            <div class="form-group">
              <label for="cod-note">Delivery note (optional)</label>
              <input type="text" id="cod-note" />
            </div>
          </div>

          <div class="form-group" style="margin-top:14px;">
            <p>Total Amount: <strong id="payment-total">R0.00</strong></p>
          </div>

          <button type="submit" class="submit-btn">Complete Purchase</button>
        </form>
      </div>
    </div>

    <script>
      // keep cart in sessionStorage (existing)
      let cart = JSON.parse(sessionStorage.getItem('cart')) || [];

      // displayCart(), updateQuantity(), removeItem(), updateCartTotal(), updateCartCount()
      // ...existing functions above should remain unchanged...
      // (No change needed here if those functions are already present earlier in the file.)

      // Payment modal behaviour and validation
      const paymentModal = document.getElementById('payment-modal');
      const closePaymentBtn = document.getElementById('close-payment');
      const continuePaymentBtn = document.getElementById('continue-payment-btn');
      const paymentForm = document.getElementById('payment-form');

      const paymentMethodRadios = document.querySelectorAll('input[name="payment-method"]');
      const cardFields = document.getElementById('card-fields');
      const paypalFields = document.getElementById('paypal-fields');
      const mobileFields = document.getElementById('mobile-fields');
      const codFields = document.getElementById('cod-fields');
      const paymentTotalEl = document.getElementById('payment-total');

      function showFieldsFor(method) {
        cardFields.style.display = method === 'card' ? '' : 'none';
        paypalFields.style.display = method === 'paypal' ? '' : 'none';
        mobileFields.style.display = method === 'mobile' ? '' : 'none';
        codFields.style.display = method === 'cod' ? '' : 'none';
      }

      // wire radios
      paymentMethodRadios.forEach(r => r.addEventListener('change', e => showFieldsFor(e.target.value)));

      continuePaymentBtn.addEventListener('click', () => {
        // update total shown in modal
        const total = cart.reduce((s, it) => s + (it.price * it.quantity), 0).toFixed(2);
        paymentTotalEl.textContent = 'R' + total;
        paymentModal.style.display = 'block';
      });

      closePaymentBtn.addEventListener('click', () => {
        paymentModal.style.display = 'none';
      });

      window.addEventListener('click', (event) => {
        if (event.target === paymentModal) paymentModal.style.display = 'none';
      });

      function validatePayment(method) {
        if (cart.length === 0) {
          alert('Your cart is empty.');
          return false;
        }
        if (method === 'card') {
          const name = document.getElementById('card-name').value.trim();
          const number = document.getElementById('card-number').value.replace(/\s+/g,'');
          const expiry = document.getElementById('expiry').value.trim();
          const cvv = document.getElementById('cvv').value.trim();
          if (!name || !number || !expiry || !cvv) {
            alert('Please complete all card fields.');
            return false;
          }
          if (!/^\d{12,19}$/.test(number)) {
            alert('Enter a valid card number (numbers only).');
            return false;
          }
        } else if (method === 'paypal') {
          const email = document.getElementById('paypal-email').value.trim();
          if (!email) { alert('Please enter your PayPal email.'); return false; }
          if (!/^\S+@\S+\.\S+$/.test(email)) { alert('Enter a valid email.'); return false; }
        } else if (method === 'mobile') {
          const provider = document.getElementById('mobile-provider').value;
          const number = document.getElementById('mobile-number').value.trim();
          if (!provider || !number) { alert('Please select provider and enter mobile number.'); return false; }
        } else if (method === 'cod') {
          const contact = document.getElementById('cod-contact').value.trim();
          if (!contact) { alert('Please provide a contact number for delivery.'); return false; }
        }
        return true;
      }

      paymentForm.addEventListener('submit', (e) => {
        e.preventDefault();
        const method = document.querySelector('input[name="payment-method"]:checked').value;
        if (!validatePayment(method)) return;

        // Simulate payment processing
        const total = cart.reduce((s, it) => s + (it.price * it.quantity), 0).toFixed(2);
        // You can expand this block to actually call a payment API
        alert(`Payment method: ${method.toUpperCase()}\nAmount: R${total}\nPayment processed (simulation).`);

        // Clear cart and update UI
        cart = [];
        sessionStorage.setItem('cart', JSON.stringify(cart));
        paymentModal.style.display = 'none';
        displayCart();
        updateCartCount();
      });

      // ensure modal shows correct fields on open (default)
      showFieldsFor(document.querySelector('input[name="payment-method"]:checked').value);

      // Initial display (if these are used earlier ensure no duplication)
      displayCart();
      updateCartCount();
    </script>
  </body>
</html>
