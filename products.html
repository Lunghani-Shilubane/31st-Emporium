<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="styles.css" />
    <title>Products</title>
  </head>
 

  <body>
    <!-- navigation links-->
    <div class="navbar" style=" z-index: 999">
      <a href="index.html">Home</a>
      <a href="products.html">Products</a>
      <a href="aboutus.html">About us</a>
        <a href="#" style="display: flex; align-items: center; justify-content: center; background: rgba(255,255,255,0.358); border-radius: 6px; width: 48px; height: 48px; padding: 0;">
    <img src="/images/cart-icon.svg" alt="Cart" style="width:28px; height:28px; margin: auto;">
  </a>
    </div>

    <div class="main-content">
      <div style="width: 100%; text-align: center; margin-bottom: 20px; font-size: 20px;">
        Welcome to our store! Browse our products and add them to your cart.
      </div>

      <div id="card-container"></div>

      
    </div>


     <script>
        // Load the JSON file (relative path) and render products
        fetch('./catelogue.json')
          .then(response => {
            if (!response.ok) throw new Error('Failed to load catelogue.json');
            return response.json();
          })
          .then(products => {
            // products should be an array of objects from catelogue.json
            const container = document.getElementById('card-container');
            container.innerHTML = ''; // clear if needed

            products.forEach(p => {
              const card = document.createElement('div');
              card.className = 'card';

              card.innerHTML = `
                <img src="${p.image || 'images/placeholder.png'}" alt="${(p.name || '')}" width="150" height="200" /><br />
                <h3>${p.name || 'Unnamed product'}</h3>
                <p>${p.description || ''}</p>
                <div class="price">${p.price !== undefined ? 'R' + p.price : ''}</div>
              `;
              container.appendChild(card);
            });
          })
          .catch(err => {
            console.error(err);
            document.getElementById('card-container').textContent = 'Could not load products.';
          });
      </script>
  </body>
</html>
