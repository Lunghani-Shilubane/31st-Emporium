<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="styles.css" />
    <title>Products</title>
  </head>
 

  <body>
    <!-- navigation links-->
    <div class="navbar" style=" z-index: 999">
      <a href="index.html">Home</a>
      <a href="products.html">Products</a>
      <a href="aboutus.html">About us</a>
        <a href="/cart.html" style="display: flex; align-items: center; justify-content: center; background: rgba(255,255,255,0.358); border-radius: 6px; width: 48px; height: 48px; padding: 0;">
    <span id="cart-count" style="position: absolute; background: red; color: white; border-radius: 50%; width: 20px; height: 20px; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: bold;">0</span>
  </a>
    </div>

    <div class="main-content">
      <div style="width: 100%; text-align: center; margin-bottom: 20px; font-size: 20px;">
        Welcome to our store! Browse our products and add them to your cart.
      </div>

      <div id="card-container"></div>
    </div>

    <!-- Modal -->
    <div id="product-modal" class="modal" style="display: none;">
      <div class="modal-content">
        <span class="close">&times;</span>
        <div class="modal-body">
          <img id="modal-image" src="" alt="Product" width="300" />
          <div class="modal-info">
            <h2 id="modal-name"></h2>
            <p id="modal-description"></p>
            <div class="quantity-section">
              <button id="decrease-qty" class="qty-btn">−</button>
              <input type="number" id="quantity" value="1" min="1" readonly />
              <button id="increase-qty" class="qty-btn">+</button>
            </div>
            <div class="price-section">
              <span>Total: </span>
              <span id="modal-price"></span>
            </div>
            <button id="add-to-cart-btn" class="add-to-cart">Add to Cart</button>
          </div>
        </div>
      </div>
    </div>

     <script>
        let currentProduct = null;

        // Load the JSON file (relative path) and render products
        fetch('./catelogue.json')
          .then(response => {
            if (!response.ok) throw new Error('Failed to load catelogue.json');
            return response.json();
          })
          .then(products => {
            // products should be an array of objects from catelogue.json
            const container = document.getElementById('card-container');
            container.innerHTML = ''; // clear if needed

            products.forEach(p => {
              const card = document.createElement('div');
              card.className = 'card';

              card.innerHTML = `
                <img src="${p.image || 'images/placeholder.png'}" alt="${(p.name || '')}" width="150" height="200" /><br />
                <h3>${p.name || 'Unnamed product'}</h3>
                <p>${p.description || ''}</p>
                <div class="price">${p.price !== undefined ? 'R' + p.price : ''}</div>
              `;
              
              card.addEventListener('click', () => openModal(p));
              container.appendChild(card);
            });
          })
          .catch(err => {
            console.error(err);
            document.getElementById('card-container').textContent = 'Could not load products.';
          });

        // Modal functions
        const modal = document.getElementById('product-modal');
        const closeBtn = document.querySelector('.close');
        const decreaseBtn = document.getElementById('decrease-qty');
        const increaseBtn = document.getElementById('increase-qty');
        const quantityInput = document.getElementById('quantity');
        const priceSpan = document.getElementById('modal-price');

        function openModal(product) {
          currentProduct = product;
          document.getElementById('modal-image').src = product.image || 'images/placeholder.png';
          document.getElementById('modal-name').textContent = product.name;
          document.getElementById('modal-description').textContent = product.description;
          quantityInput.value = 1;
          updatePrice();
          modal.style.display = 'block';
        }

        function updatePrice() {
          const qty = parseInt(quantityInput.value);
          const total = (currentProduct.price * qty).toFixed(2);
          priceSpan.textContent = 'R' + total;
        }

        closeBtn.addEventListener('click', () => {
          modal.style.display = 'none';
        });

        increaseBtn.addEventListener('click', () => {
          quantityInput.value = parseInt(quantityInput.value) + 1;
          updatePrice();
        });

        decreaseBtn.addEventListener('click', () => {
          if (parseInt(quantityInput.value) > 1) {
            quantityInput.value = parseInt(quantityInput.value) - 1;
            updatePrice();
          }
        });

        window.addEventListener('click', (event) => {
          if (event.target === modal) {
            modal.style.display = 'none';
          }
        });

        document.getElementById('add-to-cart-btn').addEventListener('click', () => {
          const qty = Math.max(1, parseInt(quantityInput.value, 10) || 1);

          // load/normalize cart
          let cart = JSON.parse(sessionStorage.getItem('cart'));
          if (!Array.isArray(cart)) cart = [];

          // ensure a stable id -- fallback to name if id is missing
          const prodId = (currentProduct && (currentProduct.id ?? currentProduct.name)) || Date.now().toString();

          // find existing item by id
          const existingItem = cart.find(item => String(item.id) === String(prodId));

          if (existingItem) {
            existingItem.quantity = (existingItem.quantity || 0) + qty;
          } else {
            cart.push({
              id: prodId,
              name: currentProduct.name || 'Product',
              price: Number(currentProduct.price) || 0,
              description: currentProduct.description || '',
              image: currentProduct.image || 'images/placeholder.png',
              quantity: qty
            });
          }

          sessionStorage.setItem('cart', JSON.stringify(cart));

          // update cart badge (sum of quantities)
          const cartCountEl = document.getElementById('cart-count');
          if (cartCountEl) {
            const totalCount = cart.reduce((sum, it) => sum + (Number(it.quantity) || 0), 0);
            cartCountEl.textContent = totalCount;
          }

          modal.style.display = 'none';
        });
      </script>
  </body>
</html>
